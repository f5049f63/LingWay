<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LingWay: подготовка к поездкам за границу. Слова, фразы и разговорные ситуации на английском."
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LingWay: английский для поездок" />
    <meta
      property="og:description"
      content="Фразы и диалоги для аэропорта, отеля, кафе и города. Учитесь по ситуациям, а не по учебнику."
    />
    <meta property="og:image" content="https://f5049f63.github.io/LingWay/og.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/LingWay/favicon.svg" />
    <script>
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <title>LingWay: английский для поездок</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
